# MLQA evaluation, top-20.
#
# Data is pulled from Hugging Face Hub by default
# (nlpai-lab/mlaire-mlqa).  Override with the top-level
# ``data_dir`` field if you want to evaluate against a local export
# (a ``mlqa`` subdirectory of ``data_dir`` will be expected).
datasets:
  mlqa:
    languages: [en, ar, de, es, hi, vi, zh]
k_values: [20]
# MRR / LPR look at the full first-relevant rank, so retrieve deeper than the
# k-set. 200 matches the depth used to produce the canonical paper results.
retrieval_top_k: 200
output_dir: results
